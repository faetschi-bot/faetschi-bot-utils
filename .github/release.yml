# .github/release.yml - shapes the auto-generated GitHub Release notes.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# GitHub reads this file from the DEFAULT branch. Each PR is listed once, under
# the first category whose labels it carries, so an extra scope label like
# `tool:visual-shot` does not move a PR out of Features/Fixes.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - semver-major
    - title: Features
      labels:
        - enhancement
        - feature
        - semver-minor
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Other Changes
      labels:
        - "*"
