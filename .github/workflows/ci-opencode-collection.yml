name: CI opencode-collection

on:
  pull_request:
    paths:
      - 'opencode-collection/**'
      - '.github/workflows/ci-opencode-collection.yml'
  push:
    branches:
      - main
    paths:
      - 'opencode-collection/**'
      - '.github/workflows/ci-opencode-collection.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode-collection
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check bin/opencode-collection.mjs && node --check lib/catalog.mjs && node --check lib/installers.mjs && node --check lib/install.mjs
      - name: Validate catalog
        run: node bin/opencode-collection.mjs doctor
      - name: Tests
        run: npm test
      - name: Pack check
        run: npm pack --dry-run
