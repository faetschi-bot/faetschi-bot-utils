# generated by mention-agent v0.1.0 - run "npm run sync-reusable" in mention-agent/ after editing lib/render.mjs.
name: mention-agent (reusable)

on:
  workflow_call:
    inputs:
      mention:
        description: "Trigger phrase to match in a comment, for example \"@example-bot\"."
        type: string
        required: true
      model:
        description: "Model in provider/model form, for example opencode-go/deepseek-v4.1-flash."
        type: string
        required: true
      provider-env:
        description: "Environment variable the provider credential is exported as, for example OPENCODE_API_KEY."
        type: string
        required: true
      agent:
        description: "Primary agent to run."
        type: string
        default: build
      identity:
        description: "pat to act as the token user, or app to use the agent GitHub App."
        type: string
        default: pat
      share:
        description: "Publish the agent session to the provider share page."
        type: boolean
        default: false
      self-login:
        description: "Login to ignore so the agent never answers itself."
        type: string
        default: ""
      allow-users:
        description: "JSON array of logins allowed to trigger a run, for example [\"alice\",\"bob\"]. Empty means any user with write access."
        type: string
        default: ""
    secrets:
      token:
        description: "GitHub token used to comment and push. Required when identity is pat."
        required: false
      provider-key:
        description: "Provider credential for the model."
        required: true

permissions:
  contents: read

jobs:
  agent:
    if: >
      github.event.comment != null && !endsWith(github.event.comment.user.login, '[bot]') && contains(github.event.comment.body, inputs.mention) && (inputs['self-login'] == '' || github.event.comment.user.login != inputs['self-login']) && (inputs['allow-users'] == '' || contains(fromJSON(inputs['allow-users']), github.event.comment.user.login))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Export the provider credential
        shell: bash
        env:
          PROVIDER_ENV: ${{ inputs.provider-env }}
          PROVIDER_KEY: ${{ secrets.provider-key }}
        run: echo "${PROVIDER_ENV}=${PROVIDER_KEY}" >> "$GITHUB_ENV"

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run the mention agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
        with:
          model: ${{ inputs.model }}
          agent: ${{ inputs.agent }}
          mentions: ${{ inputs.mention }}
          share: ${{ inputs.share }}
          use_github_token: ${{ inputs.identity == 'pat' }}
