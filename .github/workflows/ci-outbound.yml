name: CI outbound

on:
  pull_request:
    paths:
      - 'outbound/**'
      - '.github/workflows/ci-outbound.yml'
  push:
    branches:
      - main
    paths:
      - 'outbound/**'
      - '.github/workflows/ci-outbound.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check bin/outbound.mjs && node --check lib/checks.mjs
      - name: Tests
        run: npm test
      - name: Pack check
        run: npm pack --dry-run
